<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | LearnLoop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
    <div class="auth-box">
        <h2>Welcome Back 👋</h2>
        <p>Continue your learning journey.</p>
        <form onsubmit="login(event)">
            <label>Email</label>
            <input type="email" id="email" placeholder="Enter your email" required>
            <label>Password</label>
            <input type="password" id="password" placeholder="Enter your password" required>
            <button type="submit" class="primary-btn auth-submit">Login</button>
        </form>
        <p class="auth-text">New to LearnLoop? <a href="signup.html">Create an Account</a></p>
        <p class="auth-text"><a href="index.html">← Back to Home</a></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bcryptjs/2.2.0/bcrypt.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
