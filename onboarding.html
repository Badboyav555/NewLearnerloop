<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onboarding | LearnLoop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="logo">Learn<span>Loop</span></a>
        <p style="color: #777; font-size: 14px;">Step 1 of 1</p>
    </header>
    
    <div class="container">
        <div style="text-align: center; margin-bottom: 35px;">
            <p class="tagline">LET'S GET STARTED</p>
            <h1 style="font-size: 38px; margin-bottom: 12px;">Welcome to LearnLoop 👋</h1>
            <p style="color: #707784; line-height: 1.6;">Tell us a little about yourself so we can personalize your learning journey.</p>
        </div>
        <div class="onboarding-card">
            <div class="form-group">
                <label>What year are you in?</label>
                <select id="year"><option value="">Select year</option><option value="1">1st Year</option><option value="2">2nd Year</option><option value="3">3rd Year</option><option value="4">4th Year</option></select>
            </div>
            <div class="form-group">
                <label>What's your branch?</label>
                <select id="branch"><option value="">Select branch</option><option value="cse">Computer Science</option><option value="iot">CSE - IoT</option><option value="ece">Electronics & Communication</option><option value="me">Mechanical Engineering</option></select>
            </div>
            <div class="form-group">
                <label>What do you want to learn?</label>
                <div class="selection-container">
                    <button type="button" class="selection-btn" onclick="selectSubject(this)">📐 Mathematics</button>
                    <button type="button" class="selection-btn" onclick="selectSubject(this)">⚛️ Physics</button>
                    <button type="button" class="selection-btn" onclick="selectSubject(this)">💻 Programming</button>
                </div>
            </div>
            <div class="form-group">
                <label>How much time can you study daily?</label>
                <div class="selection-container">
                    <button type="button" class="time-btn" onclick="selectTime(this)">30 min</button>
                    <button type="button" class="time-btn" onclick="selectTime(this)">1 hour</button>
                    <button type="button" class="time-btn" onclick="selectTime(this)">2 hours</button>
                </div>
            </div>
            <button class="primary-btn continue-btn" onclick="saveOnboarding()">Continue →</button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bcryptjs/2.2.0/bcrypt.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
