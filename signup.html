<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | LearnLoop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-body">
    <div class="auth-box">
        <h2>Create Account 🚀</h2>
        <p>Start your personalized learning today.</p>
        <form onsubmit="signup(event)">
            <label>Email</label>
            <input type="email" id="signupEmail" placeholder="Enter your email" required>
            <label>Password</label>
            <input type="password" id="signupPassword" placeholder="Create a password (min 6 chars)" required>
            <button type="submit" class="primary-btn auth-submit">Sign Up</button>
        </form>
        <p class="auth-text">Already have an account? <a href="login.html">Login</a></p>
        <p class="auth-text"><a href="index.html">← Back to Home</a></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/bcryptjs/2.2.0/bcrypt.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
